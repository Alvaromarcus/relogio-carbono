name: Atualiza dados do ONS

on:
  schedule:
    # 13h e 20h de Brasilia, logo apos as publicacoes do ONS (12h e 19h)
    - cron: '0 16,23 * * *'
  workflow_dispatch:
  push:
    branches:
      - 'feat/**'
    paths:
      - 'scripts/**'
      - '.github/workflows/atualiza-dados.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gerar sin.json
        env:
          SUBSISTEMA: SE
        run: |
          mkdir -p docs/data
          set -o pipefail
          python scripts/build_sin.py 2>&1 | tee docs/data/diagnostico.txt

      - name: Guardar sin.json como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sin-json
          path: docs/data/sin.json
          if-no-files-found: error

      - name: Commitar se houve mudanca
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/sin.json docs/data/diagnostico.txt
          if git diff --staged --quiet; then
            echo "sem mudanca nos dados"
          else
            git commit -m "dados: atualiza sin.json ($(date -u +%FT%TZ))"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
